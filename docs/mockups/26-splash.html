<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%}
  body{background:#0a0a0b;color:#f3f3f4;font-family:-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center;animation:fade .7s ease both}
  .logo{width:96px;height:96px;border-radius:26px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;margin:0 auto 34px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .quote{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:46px;letter-spacing:.5px;line-height:1.3;max-width:860px}
  .sub{margin-top:16px;font-size:15px;color:#8b8b95;letter-spacing:2px}
  .bar{width:132px;height:3px;border-radius:2px;background:#26272c;margin:52px auto 0;overflow:hidden}
  .bar i{display:block;width:46%;height:100%;background:#fff;border-radius:2px;animation:load 1.2s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body>
  <div class="wrap">
    <div class="logo">学</div>
    <div class="quote">It’s never too late to learn</div>
    <div class="sub">学习，永远不晚</div>
    <div class="bar"><i></i></div>
  </div>
</body></html>
