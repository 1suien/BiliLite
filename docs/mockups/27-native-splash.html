<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0a0a0b;color:#f3f3f4;font-family:-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif;
 display:flex;align-items:center;justify-content:center}
.wrap{text-align:center}
.logo{width:8.2vmin;height:8.2vmin;min-width:54px;min-height:54px;border-radius:2.2vmin;background:#fff;color:#111;
 display:flex;align-items:center;justify-content:center;font-size:3.8vmin;font-weight:800;margin:0 auto 2.6vmin}
.quote{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:3.9vmin;line-height:1.3;letter-spacing:.05vmin}
.sub{margin-top:1.2vmin;font-size:1.45vmin;letter-spacing:.25vmin;color:#8b8b95}
.bar{width:11vmin;height:.32vmin;border-radius:2px;background:#26272c;margin:4.6vmin auto 0;overflow:hidden}
.bar i{display:block;width:46%;height:100%;background:#fff;border-radius:2px}
</style></head><body>
<div class="wrap">
  <div class="logo">学</div>
  <div class="quote">It’s never too late to learn</div>
  <div class="sub">学习，永远不晚</div>
  <div class="bar"><i></i></div>
</div></body></html>
