name: Create Release (restore v0.4.3)

# 由 CI 用 GITHUB_TOKEN 建 Release 并上传 APK 资产（本地无 GitHub 写权限时使用）
on:
  push:
    tags:
      - 'v0.4.3-restore*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update release with APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.4.3-restore"
          echo "gh version: $(gh --version | head -1)"
          ls -l BiliLite-0.4.3-debug.apk
          sha256sum BiliLite-0.4.3-debug.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -> 覆盖资产与说明（重打包后更新用）"
            gh release upload "$TAG" ./BiliLite-0.4.3-debug.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file docs/RELEASE-v0.4.3-restore.md
          else
            gh release create "$TAG" \
              ./BiliLite-0.4.3-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "BiliLite 0.4.3 安卓端 —— 源码还原工程 + 可安装 APK" \
              --notes-file docs/RELEASE-v0.4.3-restore.md
          fi
          echo "=== done ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
