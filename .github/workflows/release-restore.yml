name: Create Release (restore v0.4.3)

# 由 CI 用 GITHUB_TOKEN 建 Release 并上传 APK 资产（本地无 GitHub 写权限时使用）
on:
  push:
    tags:
      - 'v0.4.3-restore-ci*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release with APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.4.3-restore"
          echo "gh version: $(gh --version | head -1)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, nothing to do"
            exit 0
          fi
          ls -l BiliLite-0.4.3-debug.apk
          sha256sum BiliLite-0.4.3-debug.apk
          gh release create "$TAG" \
            ./BiliLite-0.4.3-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "BiliLite 0.4.3 安卓端 —— 源码还原工程 + 可安装 APK" \
            --notes-file docs/RELEASE-v0.4.3-restore.md
          echo "=== done ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
