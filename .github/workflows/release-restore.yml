name: Create Release (restore APK)

# 由 CI 用 GITHUB_TOKEN 建 Release 并上传 APK 资产（本地没有 GitHub 写权限时用这个口子）
# 任何 v<版本>-restore* 标签都会触发：附件取 BiliLite-<版本>-debug.apk，
# 说明优先用 docs/RELEASE-<tag>.md，没有就自动生成一段（带大小与 sha256）。
on:
  push:
    tags:
      - 'v*-restore*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick target version
        id: pick
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"; VER="${VER%%-*}"
          APK="BiliLite-${VER}-debug.apk"
          NOTES="docs/RELEASE-${TAG}.md"
          TITLE="BiliLite ${VER}（本机构建）—— 还原工程 + 可安装 APK"
          if [ ! -f "$APK" ]; then
            echo "::error::找不到 $APK"
            ls -1 BiliLite-*.apk | tail -5 || true
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            SHA=$(sha256sum "$APK" | awk '{print $1}')
            SIZE=$(stat -c%s "$APK")
            cat > /tmp/notes.md <<EOF
          本机构建 ${VER}（debug 签名，可直接覆盖安装，数据保留）。

          - 产物：${APK}（${SIZE} B，sha256 ${SHA}）
          - 源码：分支 restore/android-0.4.3，提交 ${GITHUB_SHA:0:7}

          安装：下载 APK → 允许「安装未知应用」→ 点开安装。
          EOF
            NOTES=/tmp/notes.md
          fi
          { echo "tag=$TAG"; echo "apk=$APK"; echo "notes=$NOTES"; echo "title=$TITLE"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Create or update release with APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          APK: ${{ steps.pick.outputs.apk }}
          NOTES: ${{ steps.pick.outputs.notes }}
          TITLE: ${{ steps.pick.outputs.title }}
        run: |
          set -euo pipefail
          echo "gh version: $(gh --version | head -1)"
          ls -l "$APK"
          sha256sum "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在 -> 覆盖资产与说明"
            gh release upload "$TAG" "./$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          else
            gh release create "$TAG" "./$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi
          echo "=== done ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
